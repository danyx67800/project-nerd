name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: bundle · sign · publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::Cargo.toml ($version) e tag ($GITHUB_REF_NAME) non coincidono"
            exit 1
          }

      - name: Tests
        run: cargo test --workspace

      - name: Prepare OTA signing key
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
        run: |
          if [ -z "$OTA_PRIVATE_KEY" ]; then
            echo "::error::manca il secret OTA_PRIVATE_KEY"
            exit 1
          fi
          mkdir -p .ota
          printf '%s\n' "$OTA_PRIVATE_KEY" > .ota/ota-private.key
          chmod 600 .ota/ota-private.key

      - name: Bundle universal app
        env:
          OTA_KEY: .ota/ota-private.key
        run: ./scripts/bundle.sh --universal --dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.zip dist/*.zip.sha256 dist/*.zip.sha256.sig dist/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.zip dist/*.zip.sha256 dist/*.zip.sha256.sig dist/*.dmg \
              --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi
