[workspace]
resolver = "2"
members = [
    "crates/nerd-core",
    "crates/nerd-audio",
    "crates/nerd-video",
    "crates/nerd-ui-kit",
    "crates/nerd-app",
    "tools/nerd-tools",
]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Project Nerd"]

[workspace.dependencies]
nerd-core = { path = "crates/nerd-core" }
nerd-audio = { path = "crates/nerd-audio" }
nerd-video = { path = "crates/nerd-video" }
nerd-ui-kit = { path = "crates/nerd-ui-kit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
